<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- @tool
  name: cover-overlay
  version: 1.4
  description: AI 生图（Gemini / 通义万象）+ 中文文字叠加 + 原尺寸 PNG 导出，一站制作小红书封面
  -->
  <title>封面生成工具 v1.4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "PingFang SC", sans-serif;
      background: #141414;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 292px;
      flex-shrink: 0;
      background: #1e1e1e;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    #sidebar-scroll::-webkit-scrollbar { width: 4px; }
    #sidebar-scroll::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 2px; }

    .section { margin-bottom: 18px; }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .sec-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #555;
    }
    .icon-btn {
      font-size: 17px;
      color: #555;
      cursor: pointer;
      line-height: 1;
      transition: color .1s;
    }
    .icon-btn:hover { color: #aaa; }

    /* Tabs */
    .tabs {
      display: flex;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      font-size: 12px;
      cursor: pointer;
      color: #555;
      background: #181818;
      transition: background .12s, color .12s;
      user-select: none;
    }
    .tab.active { background: #2a2a2a; color: #d0d0d0; }
    .tab:not(:last-child) { border-right: 1px solid #2a2a2a; }

    /* Upload */
    .upload-zone {
      border: 2px dashed #333;
      border-radius: 7px;
      padding: 18px 12px;
      text-align: center;
      color: #4a4a4a;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .12s, color .12s;
      display: block;
    }
    .upload-zone:hover, .upload-zone.over { border-color: #666; color: #999; }
    .upload-zone input { display: none; }

    /* AI panel */
    .field-row { margin-bottom: 8px; }
    label.fld {
      display: block;
      font-size: 11px;
      color: #5a5a5a;
      margin-bottom: 4px;
    }
    select.s, textarea.s, input.s {
      width: 100%;
      background: #252525;
      border: 1px solid #333;
      color: #ddd;
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-family: inherit;
    }
    textarea.s { resize: vertical; line-height: 1.5; }
    select.s:focus, textarea.s:focus, input.s:focus { outline: none; border-color: #4a7fff; }

    .ai-prompt { min-height: 82px; }

    .status-line {
      min-height: 20px;
      font-size: 11px;
      color: #666;
      margin: 4px 0 6px;
      line-height: 1.4;
    }
    .status-line.err { color: #e05050; }
    .status-line.ok  { color: #4dd88a; }

    /* Layer cards */
    .layer-card {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      transition: border-color .1s;
      user-select: none;
    }
    .layer-card:hover { border-color: #555; }
    .layer-card.active { border-color: #4a7fff; background: #192040; }
    .lc-label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #c8c8c8; }
    .lc-del { color: #444; font-size: 16px; line-height: 1; cursor: pointer; transition: color .1s; flex-shrink: 0; }
    .lc-del:hover { color: #d03030; }

    /* Editor */
    .editor-row { margin-bottom: 0; }
    label.efld {
      display: block;
      font-size: 11px;
      color: #5a5a5a;
      margin: 10px 0 4px;
    }
    label.efld:first-child { margin-top: 0; }

    select.ef, textarea.ef {
      width: 100%;
      background: #252525;
      border: 1px solid #333;
      color: #ddd;
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-family: inherit;
    }
    textarea.ef { resize: vertical; min-height: 60px; line-height: 1.5; }

    .row2 { display: flex; gap: 8px; }
    .row2 > * { flex: 1; min-width: 0; }

    .sr { display: flex; align-items: center; gap: 6px; }
    .sr input[type=range] { flex: 1; accent-color: #4a7fff; }
    .sv { font-size: 11px; color: #555; width: 38px; text-align: right; flex-shrink: 0; }

    input[type=color] {
      width: 100%; height: 30px;
      border: 1px solid #333; border-radius: 5px;
      background: #252525; cursor: pointer; padding: 2px;
    }

    .toggle { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #888; cursor: pointer; margin: 10px 0 6px; }
    .toggle input[type=checkbox] { accent-color: #4a7fff; width: 13px; height: 13px; }

    /* Buttons */
    button {
      border: none; border-radius: 5px;
      font-size: 13px; cursor: pointer;
      transition: opacity .1s; padding: 7px 12px;
      font-family: inherit;
    }
    button:hover:not(:disabled) { opacity: .82; }
    button:disabled { opacity: .38; cursor: not-allowed; }

    .btn-full { width: 100%; }
    .btn-add    { background: #1a3d24; color: #4de080; border: 1px solid #265932; }
    .btn-gen    { background: #2a55cc; color: #fff; font-weight: 600; flex: 1; }
    .btn-stop   { background: #3a2222; color: #e06060; border: 1px solid #5a3333; flex-shrink: 0; display: none; }
    .btn-export {
      background: #cc6010; color: #fff;
      font-weight: 600; font-size: 14px;
      padding: 11px; width: 100%;
    }

    .preset-btn {
      flex: 1; padding: 6px 0;
      background: #1a1a1a; border: 1px solid #2e2e2e;
      color: #888; font-size: 12px; border-radius: 5px;
      cursor: pointer; font-family: inherit;
      transition: border-color .1s, color .1s;
    }
    .preset-btn:hover { border-color: #4a7fff; color: #aaa; }

    .group-sep {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; color: #333;
      margin: 16px 0 8px; padding-top: 14px;
      border-top: 1px solid #1e1e1e;
    }

    .btn-clear { background: #221a1a; color: #664444; border: 1px solid #3a2222; width: 100%; margin-bottom: 6px; }
    .btn-clear:hover { color: #e06060; border-color: #5a3333; }

    #save-indicator {
      font-size: 10px; color: #2a4a2a;
      text-align: right; margin-top: 5px;
      height: 14px; transition: opacity .4s;
      opacity: 0;
    }
    #save-indicator.show { opacity: 1; }

    #sidebar-bottom {
      padding: 12px 14px;
      border-top: 1px solid #2a2a2a;
      background: #1e1e1e;
    }

    /* Canvas area */
    #canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0c0c;
      overflow: hidden;
      position: relative;
    }
    canvas {
      display: none;
      max-width: calc(100% - 32px);
      max-height: calc(100% - 32px);
      box-shadow: 0 8px 48px rgba(0,0,0,.8);
      cursor: crosshair;
    }
    #hint {
      color: #282828;
      font-size: 15px;
      user-select: none;
      pointer-events: none;
    }
    #loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.55);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 13px;
      color: #bbb;
    }
    #loading-overlay.on { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #333;
      border-top-color: #4a7fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #editor { display: none; }

    /* Modal */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-bg.on { display: flex; }
    .modal {
      background: #222;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 22px;
      width: 370px;
      max-width: calc(100vw - 32px);
    }
    .modal-hd {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .modal-title { font-size: 15px; font-weight: 600; }
    .modal-x { font-size: 22px; color: #555; cursor: pointer; line-height: 1; transition: color .1s; }
    .modal-x:hover { color: #ccc; }
    .modal label.fld { color: #666; }
    .modal input[type=password] {
      width: 100%;
      background: #181818;
      border: 1px solid #333;
      color: #ddd;
      padding: 8px 10px;
      border-radius: 5px;
      font-size: 13px;
      font-family: monospace;
    }
    .modal input:focus { outline: none; border-color: #4a7fff; }
    .modal-note {
      font-size: 11px;
      color: #4a4a4a;
      margin-top: 14px;
      line-height: 1.6;
    }
    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .btn-mcancel { background: #2a2a2a; color: #888; }
    .btn-msave   { background: #2a55cc; color: #fff; font-weight: 600; }
  </style>
</head>
<body>

<!-- ── Settings Modal ──────────────────────────── -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title">API 设置</span>
      <span class="modal-x" id="modalX">×</span>
    </div>

    <div class="field-row">
      <label class="fld">Gemini API Key（Google AI Studio）</label>
      <input type="password" id="cfgGemini" placeholder="AIza...">
    </div>

    <div class="field-row" style="margin-top:12px">
      <label class="fld">千问 API Key（DashScope）</label>
      <input type="password" id="cfgQianwen" placeholder="sk-...">
    </div>

    <label class="toggle" style="margin-top:14px">
      <input type="checkbox" id="cfgSave"> 保存到本地（localStorage）
    </label>

    <p class="modal-note">
      Key 仅保存在本机，直接发到对应 API，不经过任何中间服务器。<br><br>
      <strong>⚠ 千问限制：</strong>DashScope 不开放浏览器 CORS，从本地 HTML 文件调用会被拒绝。
      建议优先使用 Gemini；若要用千问，需通过本地服务器运行此工具。
    </p>

    <div class="modal-foot">
      <button class="btn-mcancel" id="modalCancel">取消</button>
      <button class="btn-msave"   id="modalSave">保存</button>
    </div>
  </div>
</div>

<!-- ── Sidebar ─────────────────────────────────── -->
<div id="sidebar">
  <div id="sidebar-scroll">

    <!-- Image source -->
    <div class="section">
      <div class="sec-head">
        <span class="sec-title">图片背景</span>
        <span class="icon-btn" id="settingsBtn" title="API 设置">⚙</span>
      </div>

      <div class="tabs">
        <div class="tab active" id="tabUpload">上传图片</div>
        <div class="tab"        id="tabAI">AI 生图</div>
      </div>

      <!-- Upload panel -->
      <div id="panelUpload">
        <label class="upload-zone" id="uploadZone">
          点击或拖拽上传图片
          <input type="file" id="fileInput" accept="image/*">
        </label>
      </div>

      <!-- AI gen panel -->
      <div id="panelAI" style="display:none">
        <div class="field-row">
          <label class="fld">模型</label>
          <select class="s" id="aiProvider">
            <option value="gemini">Gemini Imagen 3</option>
            <option value="qianwen">通义万象（千问）</option>
          </select>
        </div>

        <div class="field-row">
          <label class="fld">提示词（建议英文，效果更稳定）</label>
          <textarea class="s ai-prompt" id="aiPrompt" placeholder="Minimalist vertical poster, a small figure standing on a concrete foundation, vast white space, thin scaffolding lines, muted palette, flat illustration, leave upper third empty for text..."></textarea>
        </div>

        <div class="status-line" id="genStatus"></div>

        <div style="display:flex;gap:8px">
          <button class="btn-gen" id="genBtn">生成图片</button>
          <button class="btn-stop" id="stopBtn">取消</button>
        </div>
      </div>
    </div>

    <!-- Layers -->
    <div class="section">
      <div class="sec-title">文字图层</div>
      <div id="layerList"></div>
      <button class="btn-add btn-full" id="addLayerBtn" style="margin-top:2px">＋ 添加文字</button>
    </div>

    <!-- Editor -->
    <div class="section" id="editor">
      <div class="sec-title">编辑选中图层</div>

      <div style="display:flex;gap:6px;margin-bottom:12px">
        <button class="preset-btn" id="presetMain" title="主标题预设">主标题</button>
        <button class="preset-btn" id="presetSub"  title="副标题预设">副标题</button>
      </div>

      <label class="efld">内容（回车换行）</label>
      <textarea class="ef" id="eText" rows="3"></textarea>

      <div class="group-sep">字体</div>

      <label class="efld">字体</label>
      <select class="ef" id="eFont">
        <option value="Noto Sans SC">Noto Sans SC · 思源黑体（推荐）</option>
        <option value="Noto Serif SC">Noto Serif SC · 思源宋体</option>
        <option value="system">系统默认</option>
      </select>

      <label class="efld">字号</label>
      <div class="sr">
        <input type="range" id="eSize" min="10" max="400" step="1">
        <span class="sv" id="eSizeV"></span>
      </div>

      <div class="row2">
        <div>
          <label class="efld">字重</label>
          <select class="ef" id="eWeight">
            <option value="300">Light 300</option>
            <option value="normal">Regular</option>
            <option value="bold">Bold</option>
            <option value="900">Black 900</option>
          </select>
        </div>
        <div>
          <label class="efld">对齐</label>
          <select class="ef" id="eAlign">
            <option value="left">左对齐</option>
            <option value="center">居中</option>
            <option value="right">右对齐</option>
          </select>
        </div>
      </div>

      <div class="group-sep">颜色</div>

      <div class="row2">
        <div>
          <label class="efld">颜色</label>
          <input type="color" id="eColor" value="#1d2b3a">
        </div>
        <div>
          <label class="efld">不透明度</label>
          <div class="sr" style="margin-top:6px">
            <input type="range" id="eOpacity" min="0" max="100">
            <span class="sv" id="eOpacityV"></span>
          </div>
        </div>
      </div>

      <label class="efld">行间距</label>
      <div class="sr">
        <input type="range" id="eLineH" min="80" max="220" step="5">
        <span class="sv" id="eLineHV"></span>
      </div>

      <div class="group-sep">阴影</div>

      <label class="toggle">
        <input type="checkbox" id="eShadowOn"> 开启阴影
      </label>

      <div id="shadowPanel" style="display:none">
        <div class="row2">
          <div>
            <label class="efld">阴影色</label>
            <input type="color" id="eShadowColor" value="#000000">
          </div>
          <div>
            <label class="efld">阴影透明度</label>
            <div class="sr" style="margin-top:6px">
              <input type="range" id="eShadowOp" min="0" max="100">
              <span class="sv" id="eShadowOpV"></span>
            </div>
          </div>
        </div>

        <label class="efld">模糊半径</label>
        <div class="sr">
          <input type="range" id="eShadowBlur" min="0" max="80">
          <span class="sv" id="eShadowBlurV"></span>
        </div>

        <div class="row2">
          <div>
            <label class="efld">X 偏移</label>
            <div class="sr">
              <input type="range" id="eShadowX" min="-40" max="40">
              <span class="sv" id="eShadowXV"></span>
            </div>
          </div>
          <div>
            <label class="efld">Y 偏移</label>
            <div class="sr">
              <input type="range" id="eShadowY" min="-40" max="40">
              <span class="sv" id="eShadowYV"></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="sidebar-bottom">
    <button class="btn-clear btn-sm" id="clearBtn">清空工作区</button>
    <button class="btn-export" id="exportBtn">导出 PNG（原始尺寸）</button>
    <div id="save-indicator">✓ 已缓存</div>
    <div style="text-align:right;font-size:10px;color:#2e2e2e;margin-top:2px">cover-overlay v1.4</div>
  </div>
</div>

<!-- ── Canvas ─────────────────────────────────── -->
<div id="canvas-area">
  <div id="hint">上传图片 或 用 AI 生成背景后开始编辑</div>
  <canvas id="canvas"></canvas>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <span id="loadingMsg">生成中...</span>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────
//  Constants
// ─────────────────────────────────────────────────
const GEMINI_URL  = 'https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:predict';
const QIANWEN_URL = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis';
const QIANWEN_TASK = id => `https://dashscope.aliyuncs.com/api/v1/tasks/${id}`;

// ─────────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────────
let img      = null;
let layers   = [];
let sel      = null;
let drag     = null;
let dragOff  = { x: 0, y: 0 };
let scale    = 1;
let abort    = null;

const keys = { gemini: '', qianwen: '' };

// ─────────────────────────────────────────────────
//  Init: load saved keys + restore session
// ─────────────────────────────────────────────────
['gemini','qianwen'].forEach(k => {
  const v = localStorage.getItem('cov_' + k);
  if (v) keys[k] = v;
});

// Restore previous session after page load
window.addEventListener('load', () => restoreState());

// ─────────────────────────────────────────────────
//  DOM shortcuts
// ─────────────────────────────────────────────────
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const $       = id => document.getElementById(id);

// ─────────────────────────────────────────────────
//  Settings modal
// ─────────────────────────────────────────────────
$('settingsBtn').onclick  = openModal;
$('modalX').onclick       = closeModal;
$('modalCancel').onclick  = closeModal;
$('modalSave').onclick    = saveModal;

function openModal() {
  $('cfgGemini').value  = keys.gemini;
  $('cfgQianwen').value = keys.qianwen;
  $('cfgSave').checked  = !!(localStorage.getItem('cov_gemini') || localStorage.getItem('cov_qianwen'));
  $('modalBg').classList.add('on');
}
function closeModal() { $('modalBg').classList.remove('on'); }
function saveModal() {
  keys.gemini  = $('cfgGemini').value.trim();
  keys.qianwen = $('cfgQianwen').value.trim();
  if ($('cfgSave').checked) {
    keys.gemini  ? localStorage.setItem('cov_gemini',  keys.gemini)  : localStorage.removeItem('cov_gemini');
    keys.qianwen ? localStorage.setItem('cov_qianwen', keys.qianwen) : localStorage.removeItem('cov_qianwen');
  } else {
    localStorage.removeItem('cov_gemini');
    localStorage.removeItem('cov_qianwen');
  }
  closeModal();
}

// ─────────────────────────────────────────────────
//  Tabs
// ─────────────────────────────────────────────────
$('tabUpload').onclick = () => switchTab('upload');
$('tabAI').onclick     = () => switchTab('ai');

function switchTab(t) {
  const up = t === 'upload';
  $('tabUpload').classList.toggle('active',  up);
  $('tabAI').classList.toggle('active',     !up);
  $('panelUpload').style.display = up ? 'block' : 'none';
  $('panelAI').style.display     = up ? 'none'  : 'block';
}

// ─────────────────────────────────────────────────
//  Upload
// ─────────────────────────────────────────────────
const zone = $('uploadZone');
zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('over'); });
zone.addEventListener('dragleave', ()  => zone.classList.remove('over'));
zone.addEventListener('drop',      e  => { e.preventDefault(); zone.classList.remove('over'); loadBlob(e.dataTransfer.files[0]); });
$('fileInput').onchange = () => loadBlob($('fileInput').files[0]);

function loadBlob(file) {
  if (!file?.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => loadUrl(e.target.result); // dataURL, safe to cache
  reader.readAsDataURL(file);
}

function loadUrl(url, persist = true) {
  const i = new Image();
  i.crossOrigin = 'anonymous';
  i.onload = () => {
    setBg(i);
    if (persist) saveImg(url);
  };
  i.onerror = () => {
    const i2 = new Image();
    i2.onload = () => {
      setBg(i2);
      if (persist && url.startsWith('data:')) saveImg(url);
    };
    i2.src = url;
  };
  i.src = url;
}

function setBg(image) {
  img = image;
  canvas.width  = image.naturalWidth  || image.width;
  canvas.height = image.naturalHeight || image.height;
  $('hint').style.display = 'none';
  canvas.style.display = 'block';
  fitCanvas();
  render();
}

// ─────────────────────────────────────────────────
//  AI Generation
// ─────────────────────────────────────────────────
$('genBtn').onclick  = startGen;
$('stopBtn').onclick = () => abort?.abort();

async function startGen() {
  const provider = $('aiProvider').value;
  const prompt   = $('aiPrompt').value.trim();
  if (!prompt) { setStatus('请先输入提示词', 'err'); return; }

  const key = provider === 'gemini' ? keys.gemini : keys.qianwen;
  if (!key) { setStatus('未配置 API Key，请先点击 ⚙ 设置', 'err'); return; }

  abort = new AbortController();
  setBusy(true);
  setStatus('请求中...');
  showLoading('请求中...');

  try {
    const url = provider === 'gemini'
      ? await genGemini(prompt, key, abort.signal)
      : await genQianwen(prompt, key, abort.signal);
    hideLoading();
    setStatus('生成完成 ✓', 'ok');
    loadUrl(url);
  } catch (e) {
    hideLoading();
    if (e.name === 'AbortError') { setStatus('已取消'); }
    else { setStatus((e.message || '生成失败').slice(0, 70), 'err'); console.error(e); }
  } finally {
    setBusy(false);
    abort = null;
  }
}

async function genGemini(prompt, key, signal) {
  const res = await fetch(`${GEMINI_URL}?key=${key}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      instances:  [{ prompt }],
      parameters: { sampleCount: 1, aspectRatio: '3:4' }
    }),
    signal
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `Gemini ${res.status}`);
  }
  const data = await res.json();
  const pred = data.predictions?.[0];
  if (!pred?.bytesBase64Encoded) throw new Error('Gemini 未返回图片数据');
  return `data:${pred.mimeType || 'image/png'};base64,${pred.bytesBase64Encoded}`;
}

async function genQianwen(prompt, key, signal) {
  const res = await fetch(QIANWEN_URL, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${key}`,
      'Content-Type':  'application/json',
      'X-DashScope-Async': 'enable'
    },
    body: JSON.stringify({
      model:      'wanx2.1-t2i-turbo',
      input:      { prompt },
      parameters: { size: '768*1024', n: 1 }
    }),
    signal
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.message || `千问 ${res.status} — 可能是 CORS 限制，见设置说明`);
  }
  const data   = await res.json();
  const taskId = data.output?.task_id;
  if (!taskId) throw new Error('千问未返回 task_id');

  // Poll until done
  for (let t = 0; t < 40; t++) {
    await sleep(3000);
    if (signal.aborted) throw new DOMException('', 'AbortError');
    showLoading(`等待生成中...（${(t+1)*3}s）`);

    const poll = await fetch(QIANWEN_TASK(taskId), {
      headers: { 'Authorization': `Bearer ${key}` }, signal
    });
    const pd = await poll.json();
    const st = pd.output?.task_status;
    if (st === 'SUCCEEDED') {
      const url = pd.output?.results?.[0]?.url;
      if (!url) throw new Error('未获取到图片 URL');
      return url;
    }
    if (st === 'FAILED') throw new Error(pd.output?.message || '通义万象生成失败');
  }
  throw new Error('超时：请稍后重试');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function setBusy(on) {
  $('genBtn').disabled       = on;
  $('stopBtn').style.display = on ? 'inline-block' : 'none';
}
function setStatus(msg, cls) {
  const el = $('genStatus');
  el.textContent = msg;
  el.className = 'status-line' + (cls ? ' ' + cls : '');
}
function showLoading(msg) {
  $('loading-overlay').classList.add('on');
  $('loadingMsg').textContent = msg;
}
function hideLoading() { $('loading-overlay').classList.remove('on'); }

// ─────────────────────────────────────────────────
//  Canvas fit
// ─────────────────────────────────────────────────
function fitCanvas() {
  if (!img) return;
  const area = $('canvas-area');
  const mw = area.clientWidth - 32, mh = area.clientHeight - 32;
  scale = Math.min(mw / canvas.width, mh / canvas.height, 1);
  canvas.style.width  = (canvas.width  * scale) + 'px';
  canvas.style.height = (canvas.height * scale) + 'px';
}
window.addEventListener('resize', () => { fitCanvas(); render(); });

// ─────────────────────────────────────────────────
//  Layers
// ─────────────────────────────────────────────────
function newLayer() {
  return {
    text: '文字', font: 'Noto Sans SC',
    size: 100, weight: 'bold', align: 'center',
    color: '#1d2b3a', opacity: 100, lineH: 140,
    x: 50, y: 10 + layers.length * 14,
    shadowOn: false, shadowColor: '#000000',
    shadowOp: 60, shadowBlur: 20, shadowX: 0, shadowY: 6
  };
}

$('addLayerBtn').onclick = () => {
  const l = newLayer();
  layers.push(l);
  select(l);
  renderList();
  render();
};

function renderList() {
  const list = $('layerList');
  list.innerHTML = '';
  layers.forEach(l => {
    const card = document.createElement('div');
    card.className = 'layer-card' + (l === sel ? ' active' : '');

    const lbl = document.createElement('span');
    lbl.className = 'lc-label';
    lbl.textContent = l.text.split('\n')[0].slice(0, 14) || '（空）';

    const del = document.createElement('span');
    del.className = 'lc-del';
    del.textContent = '×';
    del.onclick = e => {
      e.stopPropagation();
      layers = layers.filter(x => x !== l);
      if (sel === l) { sel = null; showEditor(false); }
      renderList(); render();
    };

    card.append(lbl, del);
    card.onclick = () => { select(l); renderList(); };
    list.appendChild(card);
  });
}

function select(l) {
  sel = l;
  renderList();
  showEditor(!!l);
  if (l) fillEditor(l);
  render();
}
function showEditor(v) { $('editor').style.display = v ? 'block' : 'none'; }

// ─────────────────────────────────────────────────
//  Editor
// ─────────────────────────────────────────────────
function fillEditor(l) {
  $('eText').value   = l.text;
  $('eFont').value   = l.font || 'Noto Sans SC';
  sr('eSize',  'eSizeV',  l.size,     'px');
  $('eWeight').value = l.weight;
  $('eAlign').value  = l.align;
  $('eColor').value  = l.color;
  sr('eOpacity','eOpacityV', l.opacity, '%');
  sr('eLineH',  'eLineHV',   l.lineH,   '%');
  $('eShadowOn').checked = l.shadowOn;
  $('shadowPanel').style.display = l.shadowOn ? 'block' : 'none';
  $('eShadowColor').value = l.shadowColor;
  sr('eShadowOp',   'eShadowOpV',   l.shadowOp,   '%');
  sr('eShadowBlur', 'eShadowBlurV', l.shadowBlur, 'px');
  sr('eShadowX',    'eShadowXV',    l.shadowX,    'px');
  sr('eShadowY',    'eShadowYV',    l.shadowY,    'px');
}
function sr(id, vid, v, u) { $(id).value = v; $(vid).textContent = v + u; }

// Wire editor controls
(function wire() {
  function bind(id, prop, parse) {
    $(id).addEventListener('input', () => {
      if (!sel) return;
      sel[prop] = parse ? parse($(id).value) : $(id).value;
      fillEditor(sel); renderList(); render();
    });
  }
  const num = v => +v;
  bind('eText',       'text');
  bind('eFont',       'font');
  bind('eSize',       'size',      num);
  bind('eWeight',     'weight');
  bind('eAlign',      'align');
  bind('eColor',      'color');
  bind('eOpacity',    'opacity',   num);
  bind('eLineH',      'lineH',     num);
  bind('eShadowColor','shadowColor');
  bind('eShadowOp',   'shadowOp',  num);
  bind('eShadowBlur', 'shadowBlur',num);
  bind('eShadowX',    'shadowX',   num);
  bind('eShadowY',    'shadowY',   num);

  // textarea needs keyup too for immediate feedback while typing
  $('eText').addEventListener('keyup', () => { if (sel) { sel.text = $('eText').value; renderList(); render(); } });

  $('eShadowOn').onchange = e => {
    if (!sel) return;
    sel.shadowOn = e.target.checked;
    $('shadowPanel').style.display = e.target.checked ? 'block' : 'none';
    render();
  };
})();

// ─────────────────────────────────────────────────
//  Presets
// ─────────────────────────────────────────────────
const PRESETS = {
  main: { font: 'Noto Sans SC', size: 108, weight: '900',    align: 'center', color: '#1d2b3a', opacity: 100, lineH: 115, shadowOn: false },
  sub:  { font: 'Noto Sans SC', size:  52, weight: 'normal', align: 'center', color: '#6a7a8a', opacity: 100, lineH: 145, shadowOn: false },
};

function applyPreset(key) {
  if (!sel) return;
  Object.assign(sel, PRESETS[key]);
  fillEditor(sel);
  render();
}

$('presetMain').onclick = () => applyPreset('main');
$('presetSub').onclick  = () => applyPreset('sub');

// ─────────────────────────────────────────────────
//  Render
// ─────────────────────────────────────────────────
function layerFont(l) {
  const fam = (!l.font || l.font === 'system')
    ? '-apple-system,"PingFang SC",sans-serif'
    : `"${l.font}",-apple-system,"PingFang SC",sans-serif`;
  return `${l.weight} ${l.size}px ${fam}`;
}

function hex2rgba(hex, pct) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${pct/100})`;
}

function drawLayer(l, exporting) {
  const W = canvas.width, H = canvas.height;
  const px = W * l.x / 100, py = H * l.y / 100;
  const step = l.size * (l.lineH / 100);
  const lines = l.text.split('\n');
  const font  = layerFont(l);

  ctx.save();
  ctx.globalAlpha  = l.opacity / 100;
  ctx.font         = font;
  ctx.textBaseline = 'top';
  ctx.textAlign    = l.align;
  ctx.fillStyle    = l.color;
  if (l.shadowOn) {
    ctx.shadowColor   = hex2rgba(l.shadowColor, l.shadowOp);
    ctx.shadowBlur    = l.shadowBlur;
    ctx.shadowOffsetX = l.shadowX;
    ctx.shadowOffsetY = l.shadowY;
  }
  lines.forEach((line, i) => ctx.fillText(line, px, py + i * step));
  ctx.restore();

  // Selection outline (preview only)
  if (!exporting && l === sel) {
    ctx.save();
    ctx.font = font; ctx.textAlign = l.align;
    const widest = lines.reduce((a,b) => ctx.measureText(a).width > ctx.measureText(b).width ? a : b, '');
    const tw = ctx.measureText(widest).width;
    const th = l.size + (lines.length - 1) * step;
    let ox = px;
    if (l.align === 'center') ox -= tw/2;
    if (l.align === 'right')  ox -= tw;
    ctx.strokeStyle = 'rgba(74,127,255,.85)';
    ctx.lineWidth   = 3;
    ctx.setLineDash([8,5]);
    ctx.strokeRect(ox-10, py-10, tw+20, th+20);
    ctx.setLineDash([]);
    ctx.fillStyle = '#4a7fff';
    [[ox-10,py-10],[ox+tw+10,py-10],[ox-10,py+th+10],[ox+tw+10,py+th+10]].forEach(([hx,hy]) => {
      ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img) ctx.drawImage(img, 0, 0);
  layers.forEach(l => drawLayer(l, false));
  saveLayers();
}

// ─────────────────────────────────────────────────
//  Drag
// ─────────────────────────────────────────────────
function mouse(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}

function hitTest(m) {
  for (let i = layers.length - 1; i >= 0; i--) {
    const l  = layers[i];
    const px = canvas.width  * l.x / 100;
    const py = canvas.height * l.y / 100;
    ctx.font = layerFont(l);
    ctx.textAlign = l.align;
    const ls  = l.text.split('\n');
    const w   = ctx.measureText(ls.reduce((a,b) => a.length>b.length?a:b,'')).width;
    const h   = l.size + (ls.length-1) * l.size * (l.lineH/100);
    let ox = px;
    if (l.align==='center') ox -= w/2;
    if (l.align==='right')  ox -= w;
    if (m.x>=ox-14 && m.x<=ox+w+14 && m.y>=py-14 && m.y<=py+h+14) return l;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const m = mouse(e), hit = hitTest(m);
  if (hit) {
    drag = hit;
    dragOff.x = m.x - canvas.width  * hit.x / 100;
    dragOff.y = m.y - canvas.height * hit.y / 100;
    select(hit);
    canvas.style.cursor = 'grabbing';
  } else { select(null); renderList(); }
});

canvas.addEventListener('mousemove', e => {
  if (!drag) { canvas.style.cursor = hitTest(mouse(e)) ? 'grab' : 'crosshair'; return; }
  const m = mouse(e);
  drag.x = (m.x - dragOff.x) / canvas.width  * 100;
  drag.y = (m.y - dragOff.y) / canvas.height * 100;
  render();
});

canvas.addEventListener('mouseup',    () => { drag = null; canvas.style.cursor = 'crosshair'; });
canvas.addEventListener('mouseleave', () => { drag = null; });

// ─────────────────────────────────────────────────
//  Export
// ─────────────────────────────────────────────────
// ─────────────────────────────────────────────────
//  Cache（localStorage for layers, IDB for image）
// ─────────────────────────────────────────────────
const CACHE_DB    = 'cov-cache';
const CACHE_STORE = 'kv';
let   cacheDB     = null;

function openCacheDB() {
  if (cacheDB) return Promise.resolve(cacheDB);
  return new Promise((res, rej) => {
    const req = indexedDB.open(CACHE_DB, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(CACHE_STORE);
    req.onsuccess = e => { cacheDB = e.target.result; res(cacheDB); };
    req.onerror   = e => rej(e.target.error);
  });
}

function idbPut(key, val) {
  return openCacheDB().then(db =>
    new Promise((res, rej) => {
      const req = db.transaction(CACHE_STORE, 'readwrite').objectStore(CACHE_STORE).put(val, key);
      req.onsuccess = () => res();
      req.onerror   = e => rej(e.target.error);
    })
  );
}
function idbGet(key) {
  return openCacheDB().then(db =>
    new Promise((res, rej) => {
      const req = db.transaction(CACHE_STORE).objectStore(CACHE_STORE).get(key);
      req.onsuccess = e => res(e.target.result);
      req.onerror   = e => rej(e.target.error);
    })
  );
}
function idbDel(key) {
  return openCacheDB().then(db =>
    new Promise((res, rej) => {
      const req = db.transaction(CACHE_STORE, 'readwrite').objectStore(CACHE_STORE).delete(key);
      req.onsuccess = () => res();
      req.onerror   = e => rej(e.target.error);
    })
  );
}

// Flash "已缓存" indicator
let _saveTimer = null;
function flashSaved() {
  const el = $('save-indicator');
  el.classList.add('show');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// Save layers to localStorage
function saveLayers() {
  try {
    localStorage.setItem('cov_layers', JSON.stringify(layers));
    flashSaved();
  } catch (e) { /* quota exceeded, skip */ }
}

// Save image dataURL to IDB (async, best-effort)
function saveImg(dataUrl) {
  if (!dataUrl) return;
  idbPut('image', dataUrl).then(flashSaved).catch(() => {});
}

// Restore session on load
async function restoreState() {
  // Layers
  try {
    const saved = localStorage.getItem('cov_layers');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length) {
        layers = parsed;
        renderList();
      }
    }
  } catch (e) {}

  // Image
  try {
    const dataUrl = await idbGet('image');
    if (dataUrl) loadUrl(dataUrl, false); // false = don't re-save (already cached)
  } catch (e) {}
}

// Clear all
$('clearBtn').onclick = () => {
  if (!confirm('清空工作区？图片和所有文字图层都会清除。')) return;
  layers = [];
  sel    = null;
  img    = null;
  canvas.style.display = 'none';
  $('hint').style.display = '';
  renderList();
  showEditor(false);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  localStorage.removeItem('cov_layers');
  idbDel('image').catch(() => {});
};

$('exportBtn').onclick = () => {
  if (!img) { alert('请先添加图片背景'); return; }
  const prev = sel; sel = null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img, 0, 0);
  layers.forEach(l => drawLayer(l, true));
  try {
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      Object.assign(document.createElement('a'), { download:'cover.png', href:url }).click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      sel = prev; render();
    }, 'image/png');
  } catch {
    alert('导出失败：图片跨域限制。\n请上传本地图片或使用 Gemini 生成的图片（base64 不受限）。');
    sel = prev; render();
  }
};
